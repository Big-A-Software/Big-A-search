<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Big-A Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: white;
    }

    .search-page {
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo {
      width: min(700px, 90vw);
      height: auto;
      margin-bottom: 28px;
    }

    .search-container {
      width: min(700px, 92vw);
    }

    .information {
      border-top: 1px solid #e5e5e5;
      text-align: center;
      padding: 80px 25px 100px;
      background: #fafafa;
    }

    .information h2 {
      font-size: 32px;
      margin: 0 0 15px;
      font-weight: 500;
    }

    .information p {
      max-width: 650px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.6;
      color: #5f6368;
    }

    .count {
      color: #0b57d0;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #70757a;
      font-size: 14px;
      border-top: 1px solid #e5e5e5;
    }
  </style>

  <!-- Big-A Google Programmable Search -->
  <script async src="https://cse.google.com/cse.js?cx=173229edb35754eeb"></script>
</head>

<body>

  <main class="search-page">

    <!-- Big-A logo -->
    <img
      class="logo"
      src="big-a logo.jpg"
      alt="Big-A"
    >

    <!-- Search box -->
    <div class="search-container">
      <div class="gcse-search"></div>
    </div>

  </main>

  <section class="information">
    <h2><span class="count">50+</span> websites crawled so far</h2>

    <p>
      Big-A searches across a growing collection of websites from around
      the web. We're continuing to add more websites to make Big-A
      broader, more useful, and better at finding what you're looking for.
    </p>
  </section>

  <footer>
    Big-A Search
  </footer>

</body>
</html>
