name: Add Arc to Big-A Search

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-arc-site.yml'

permissions:
  contents: write

jobs:
  add-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add arc.net to sites.json
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/sites.json';
          const sites = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!sites.includes('arc.net')) sites.push('arc.net');
          const unique = [...new Set(sites)].sort();
          fs.writeFileSync(path, JSON.stringify(unique, null, 4) + '\n');
          NODE
      - name: Commit change
        run: |
          git config user.name "Big-A Search"
          git config user.email "big-a-search@users.noreply.github.com"
          git add data/sites.json
          if git diff --cached --quiet; then
            echo "arc.net is already present."
          else
            git commit -m "Add Arc to Big-A Search sites"
            git push
          fi
