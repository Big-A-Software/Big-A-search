name: Big-A Search Crawler

on:
  # Allows us to run the crawler manually from GitHub.
  workflow_dispatch:

  # Automatically crawl once every hour.
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:

      # Download the Big-A Search repository.
      - name: Get Big-A Search
        uses: actions/checkout@v4

      # Install Node.js so crawler.js can run.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Run the Big-A crawler.
      - name: Crawl websites
        run: node crawler/crawler.js

      # Save both the search index AND the list of domains already crawled.
      # Without crawled-sites.json, every Action run thinks all domains are new.
      - name: Save search index and crawler history
        run: |
          git config user.name "Big-A Search Crawler"
          git config user.email "big-a-search-crawler@users.noreply.github.com"

          git add data/index.json data/crawled-sites.json

          if git diff --cached --quiet; then
            echo "The search index and crawler history have not changed."
          else
            git commit -m "Update Big-A Search index and crawler history"
            git push
          fi
